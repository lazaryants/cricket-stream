server {
    listen 80;
    listen [::]:80;

    server_name de.cricket-stream.icu;
    root /opt/cricket-stream/frontend/dist;
    index index.html;

    access_log /var/log/nginx/cricket-stream.access.log;
    error_log /var/log/nginx/cricket-stream.error.log;

    client_max_body_size 20m;

    # HLS segments contain a short-lived playback token in
    # the query string. Do not write those URLs to access logs.
    location ~ ^/api/v1/streams/[0-9]+/hls/ {
        access_log off;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # Do not add a public /hls/ alias. Preview files are
    # intentionally served only by the authenticated API.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|webp|woff|woff2|ttf)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
